<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>left gap repro — exact Typora DOM</title>
<link rel="stylesheet" href="typlatex-article.css">
<style>
  body { margin: 0; }
  /* 复刻 Typora base.css 对行内公式的关键设定 */
  .md-inline-math { display: inline; }
  .md-inline-math .md-meta { display: none; }
  .md-inline-math-container { }
  .md-inline-math-container { }
  .mjx-container { display: inline-block; font-family: "Times New Roman", serif; font-style: italic; }
</style>
</head>
<body>
<div id="write">
  <p>字线一次打开一整行门卫，位线负责一整列的数据进出；许多单元挂在同一根位线上，最终形成远大于 &#8203;<span class="md-inline-math"><span class="md-before md-meta">$</span><span class="md-inline-math-container"><span class="mjx-container">C<sub>S</sub></span></span><span class="md-after md-meta">$</span><span class="md-math-after-sym"></span></span>&#8203; 的位线电容 &#8203;<span class="md-inline-math"><span class="md-before md-meta">$</span><span class="md-inline-math-container"><span class="mjx-container">C<sub>B</sub></span></span><span class="md-after md-meta">$</span><span class="md-math-after-sym"></span></span>&#8203;。</p>
  <p>第一代商用 DRAM 是 Intel 1970 年量产的 &#8203;<span class="md-inline-math"><span class="md-before md-meta">$</span><span class="md-inline-math-container"><span class="mjx-container">1&thinsp;kb</span></span><span class="md-after md-meta">$</span><span class="md-math-after-sym"></span></span>&#8203; 芯片，用的是 p 沟 MOS 和 3 管单元；到第二代 &#8203;<span class="md-inline-math"><span class="md-before md-meta">$</span><span class="md-inline-math-container"><span class="mjx-container">4&thinsp;kb</span></span><span class="md-after md-meta">$</span><span class="md-math-after-sym"></span></span>&#8203; 就改成了 n 沟单管单元。从那以后 1T1C 凭"单元最小、集成度最高"一统天下，至今仍是主流。</p>
  <p>写操作很简单：字线加高电平开门，位线上的电位（0 或高电平）就通过管子灌进 &#8203;<span class="md-inline-math"><span class="md-before md-meta">$</span><span class="md-inline-math-container"><span class="mjx-container">C<sub>S</sub></span></span><span class="md-after md-meta">$</span><span class="md-math-after-sym"></span></span>&#8203; 存起来。为了保证写入过程中管子始终导通，字线高电平要比位线高电平（如 &#8203;<span class="md-inline-math"><span class="md-before md-meta">$</span><span class="md-inline-math-container"><span class="mjx-container">V<sub>dd</sub></span></span><span class="md-after md-meta">$</span><span class="md-math-after-sym"></span></span>&#8203;）<strong>至少高一个</strong> &#8203;<span class="md-inline-math"><span class="md-before md-meta">$</span><span class="md-inline-math-container"><span class="mjx-container">V<sub>T</sub></span></span><span class="md-after md-meta">$</span><span class="md-math-after-sym"></span></span>&#8203;。</p>
</div>
</body>
</html>
